name: Daily Tech Trend Intelligence Bot

on:
  schedule:
    # 00:50 UTC = 07:50 WIB (sedikit sebelum jam 8 pagi untuk antisipasi queue lag)
    - cron: '50 0 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual kapan saja

jobs:
  run-trend-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Trend Intelligence Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python trend_agent/main.py
